<section class="w-full h-screen bg-secondaryg dark:bg-transparent flex items-center justify-center">
  <div class="container mx-auto flex flex-col md:flex-row items-center justify-center px-6 md:px-0 gap-12">
    <!-- Texte à gauche -->
    <div class="md:w-5/12 text-center md:text-left">
      <h1 class="text-3xl md:text-1xl  text-primary dark:text-secondary">
        Welcome to My Portfolio
      </h1>
      <p class="mt-4 text-6xl md:text-7xl font-bold text-black dark:text-white tracking-tight">
        I'm Fatma Baccari
      </p>
   <div class="mt-8 flex justify-center md:justify-start gap-6">
  <a href="#projects" class="px-8 py-3 bg-gradient-to-r from-pink-400 to-blue-400 dark:from-purple-600 dark:to-blue-500 text-white font-semibold rounded-lg shadow-lg hover:scale-105 hover:shadow-xl transition-transform duration-300">
    View Projects
  </a>

  <!-- Social icons -->
  <ng-container *ngFor="let link of contactLinks">
    <a [href]="link.url" [target]="link.external ? '_blank' : '_self'" class="flex items-center px-3 py-2 bg-transparant">
      <app-lordicon [src]="link.icon" width="40px" height="40px" color="primary"></app-lordicon>
    </a>
  </ng-container>
</div>

    </div>

    <!-- Photo avec cercle lumineux -->
    <div class="md:w-5/12 mt-10 md:mt-0 flex justify-center items-center relative">
      <div class="absolute w-72 h-72 bg-secondaryg dark:bg-gray-800 rounded-full border border-white shadow-[0_0_20px_rgba(140,98,149,1),0_0_40px_rgba(140,98,149,1),0_0_60px_rgba(222,186,231,1)] animate-spin-slow before:absolute before:top-[-10px] before:left-[-10px] before:right-[-10px] before:bottom-[-10px] before:border-2 before:border-white before:border-opacity-30 before:rounded-full before:animate-pulse"></div>

      <img src="assets/image.png" alt="Fatma Baccari" class="relative rounded-full" style="width: 160px; height: 280px;">
    </div>
  </div>
</section>

<style>
@keyframes spin-slow {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.animate-spin-slow {
  animation: spin-slow 15s linear infinite;
}

@keyframes pulse {
  0%,100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.05); }
}
.before\:animate-pulse::before {
  animation: pulse 3s ease-in-out infinite;
}
</style>
