<section class="w-full h-screen  dark:bg-transparent flex items-center justify-center">
  <div
    class="container mx-auto flex flex-col md:flex-row items-center justify-center px-6 md:px-0 gap-12"
  >
    <!-- Texte à gauche -->
<div class="md:w-5/12 text-center md:text-left flex flex-col justify-center">
  <!-- Titre -->
<h1 class="text-2xl md:text-1xl text-primary dark:text-secondary"> {{ 'HOME.TITLE' | translate }}</h1>

<!-- Description -->
<p class="mt-10 text-xl md:text-2xl font-medium text-gray-900 dark:text-white tracking-tight leading-relaxed">
  {{ 'HOME.DESCRIPTION' | translate }}
</p>


  <!-- Boutons et icônes sociales -->
  <div class="mt-6 flex flex-wrap justify-center md:justify-start items-center gap-4">
    <!-- Bouton projets -->
    <a
      href="#projects"
      class="px-6 py-3 bg-gradient-to-r from-pink-400 to-blue-400 dark:from-purple-600 dark:to-blue-500
             text-white font-semibold rounded-lg shadow-lg hover:scale-105 hover:shadow-xl
             transition-transform duration-300"
    >
      {{ 'HOME.PROJECTS' | translate }}
    </a>

    <!-- Icônes sociales -->
    <ng-container *ngFor="let link of contactLinks">
      <a
        [href]="link.url"
        [target]="link.external ? '_blank' : '_self'"
        class="flex items-center p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition"
      >
        <app-lordicon
          [src]="link.icon"
          width="40px"
          height="40px"
          color="primary"
        ></app-lordicon>
      </a>
    </ng-container>
  </div>
</div>


    <!-- Photo avec cercle lumineux -->
    <div class="md:w-5/12 mt-10 md:mt-0 flex justify-center items-center relative">
      <div
        class="absolute w-72 h-72 bg-secondaryg dark:bg-gray-800 rounded-full border border-white shadow-[0_0_20px_rgba(140,98,149,1),0_0_40px_rgba(140,98,149,1),0_0_60px_rgba(222,186,231,1)] animate-spin-slow before:absolute before:top-[-10px] before:left-[-10px] before:right-[-10px] before:bottom-[-10px] before:border-2 before:border-white before:border-opacity-30 before:rounded-full before:animate-pulse"
      ></div>

      <img
        src="assets/image.png"
        alt="Fatma Baccari"
        class="relative rounded-full"
        style="width: 160px; height: 280px"
      />
    </div>
  </div>
</section>
