<div class="absolute inset-0 overflow-hidden z-0">
  <!-- Mode sombre : Étoiles et météores -->
  @if (darkMode) {
    <!-- Étoiles -->
   <div
  class="fixed inset-0 overflow-hidden pointer-events-none z-0 transition-colors duration-700"
  [ngClass]="darkMode ? 'bg-gray-900' : 'bg-white'">

  <!-- Stars (uniquement en mode sombre) -->
  <ng-container *ngIf="darkMode">
    <div
      *ngFor="let star of stars"
      class="absolute rounded-full animate-pulse-subtle bg-white"
      [ngStyle]="{
        width: star.size + 'px',
        height: star.size + 'px',
        left: star.x + '%',
        top: star.y + '%',
        opacity: star.opacity,
        animationDuration: star.animationDuration + 's'
      }">
    </div>
  </ng-container>

  <!-- Meteors (uniquement en mode sombre) -->
  <ng-container *ngIf="darkMode">
    <div
      *ngFor="let meteor of meteors"
      class="meteor absolute rounded-full animate-meteor bg-gradient-to-r from-white to-transparent"
      [ngStyle]="{
        width: meteor.size * 50 + 'px',
        height: meteor.size * 2 + 'px',
        left: meteor.x + '%',
        top: meteor.y + '%',
        animationDelay: meteor.delay + 's',
        animationDuration: meteor.animationDuration + 's'
      }">
    </div>
  </ng-container>

</div>
  }
  
  <!-- Mode clair : Cercles colorés -->
  @else {
    @for (circle of circles; track circle.id) {
      <div 
        class="absolute rounded-full animate-pulse-slow bg-gradient-to-br blur-xl"
        [class]="circle.colorFrom + ' ' + circle.colorTo"
        [style]="{
          'top': circle.top,
          'left': circle.left,
          'width': circle.size,
          'height': circle.size,
          'opacity': circle.opacity,
          'animation-delay': circle.delay + 's'
        }">
      </div>
    }
  }
</div>
