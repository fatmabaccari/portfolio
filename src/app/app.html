<div class="relative w-full">
  <!-- Background -->
<app-star-background 
  [darkMode]="darkMode"
  class="absolute inset-0 z-0 pointer-events-none">
</app-star-background>


  <!-- Contenu principal -->
  <div class="relative z-10">
    <app-bar 
      [darkMode]="darkMode"
      (darkModeToggled)="darkMode = $event">
    </app-bar>

    <app-home></app-home>
    <app-about></app-about>
    <app-projects></app-projects>

  </div>
</div>
